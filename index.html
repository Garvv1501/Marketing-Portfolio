<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Garv Chugh — Social Media Strategist</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,200;1,9..144,400;1,9..144,700&family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0A1628;
  --navy-mid:#111E35;
  --navy-light:#192B4A;
  --gold:#BF9B5F;
  --gold-light:#D4B97C;
  --gold-pale:#F0E8D8;
  --cream:#F8F6F1;
  --off:#EEEAE2;
  --mist:#E2DDD4;
  --ink:#18182A;
  --grey:#717185;
  --grey-light:#B8B8CC;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Instrument Sans',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden;}
 
/* CURSOR */
.cursor{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transition:transform .12s;}
.cursor-ring{position:fixed;width:28px;height:28px;border:1px solid rgba(191,155,95,.5);border-radius:50%;pointer-events:none;z-index:9998;transition:all .28s ease;}
.cursor.grow{transform:scale(3.5);opacity:.3;}
 
/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.5rem 5rem;
  transition:all .4s;
}
nav.scrolled{
  background:rgba(10,22,40,.96);
  backdrop-filter:blur(18px);
  padding:1rem 5rem;
  border-bottom:1px solid rgba(191,155,95,.12);
}
.nav-logo{
  font-family:'Unbounded',sans-serif;
  font-size:1rem;letter-spacing:.06em;
  color:var(--cream);text-decoration:none;
  display:flex;align-items:baseline;gap:.15rem;
}
.nav-logo span{color:var(--gold);}
.nav-links{display:flex;gap:2.5rem;list-style:none;}
.nav-links a{
  font-size:.75rem;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.45);text-decoration:none;
  transition:color .2s;position:relative;
}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .2s;}
.nav-links a:hover{color:var(--gold);}
.nav-links a:hover::after{transform:scaleX(1);}
.hire-link{
  color:var(--gold) !important;
  border:1px solid rgba(191,155,95,.35);
  padding:.38rem 1.1rem;
  transition:background .2s !important;
}
.hire-link:hover{background:rgba(191,155,95,.12);}
.hire-link::after{display:none !important;}
/* HAMBURGER */
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;z-index:200;}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--cream);transition:all .3s;transform-origin:center;}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.mobile-menu{display:none;position:fixed;inset:0;background:var(--navy);z-index:150;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-family:'Fraunces',serif;font-size:2.2rem;font-weight:200;color:var(--cream);text-decoration:none;letter-spacing:.02em;font-style:italic;transition:color .2s;}
.mobile-menu a:hover{color:var(--gold);}
 
/* HERO */
#hero{
  min-height:100vh;
  background:var(--navy);
  display:grid;
  grid-template-columns:1fr 1fr;
  position:relative;
  overflow:hidden;
}
.hero-bg-word{
  position:absolute;
  right:-4rem;top:50%;
  transform:translateY(-50%);
  font-family:'Unbounded',sans-serif;
  font-size:21vw;
  color:rgba(255,255,255,.022);
  pointer-events:none;white-space:nowrap;letter-spacing:-.02em;
}
.hero-left{
  display:flex;flex-direction:column;justify-content:center;
  padding:9rem 4rem 6rem 5rem;
  position:relative;z-index:2;
}
.hero-eyebrow{
  font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold);margin-bottom:2rem;
  display:flex;align-items:center;gap:1rem;
  opacity:0;animation:fromLeft .9s .15s forwards;
}
.hero-eyebrow::before{content:'';display:inline-block;width:2.5rem;height:1px;background:var(--gold);}
.hero-name{
  font-family:'Fraunces',serif;
  font-size:clamp(3.2rem,6vw,5.5rem);
  font-weight:200;line-height:.92;
  color:var(--cream);letter-spacing:-.03em;
  margin-bottom:.4rem;
  opacity:0;animation:fromLeft .9s .35s forwards;
}
.hero-name strong{font-weight:700;font-style:italic;color:var(--gold);}
.hero-role{
  font-family:'Fraunces',serif;
  font-size:clamp(1rem,1.8vw,1.35rem);
  font-weight:200;font-style:italic;
  color:rgba(255,255,255,.38);
  margin-bottom:2.5rem;
  opacity:0;animation:fromLeft .9s .5s forwards;
}
.hero-bio{
  font-size:.9rem;line-height:2;
  color:rgba(255,255,255,.5);
  max-width:440px;margin-bottom:3.5rem;
  opacity:0;animation:fromLeft .9s .65s forwards;
}
.hero-stats{
  display:flex;gap:3rem;margin-bottom:3.5rem;
  opacity:0;animation:fromLeft .9s .8s forwards;
}
.stat{display:flex;flex-direction:column;}
.stat-n{
  font-family:'Unbounded',sans-serif;
  font-size:2.2rem;line-height:1;
  color:var(--gold);letter-spacing:.02em;
}
.stat-l{
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-top:.3rem;
}
.hero-btns{
  display:flex;gap:1rem;flex-wrap:wrap;
  opacity:0;animation:fromLeft .9s .95s forwards;
}
.btn-primary{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--gold);color:var(--navy);
  padding:.85rem 2rem;
  font-size:.76rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;
  transition:all .25s;
}
.btn-primary:hover{background:var(--gold-light);transform:translateY(-2px);}
.btn-secondary{
  display:inline-flex;align-items:center;gap:.5rem;
  background:transparent;color:rgba(255,255,255,.7);
  padding:.85rem 2rem;
  font-size:.76rem;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.18);
  transition:all .25s;
}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold);}
  /* HERO RIGHT */
.hero-right{
  position:relative;
  display:flex;align-items:stretch;
  overflow:hidden;
}
.hero-right::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(to right,var(--navy) 0%,rgba(10,22,40,.2) 35%),
             linear-gradient(180deg,rgba(10,22,40,.4) 0%,transparent 40%);
  z-index:1;
}
.hero-img{
  width:100%;height:100%;
  object-fit:cover;object-position:center top;
  filter:grayscale(15%) contrast(1.08);
  opacity:0;animation:fadeIn 1.5s .5s forwards;
}
.hero-card{
  position:absolute;bottom:3.5rem;right:2.5rem;z-index:2;
  background:rgba(10,22,40,.75);
  border:1px solid rgba(191,155,95,.25);
  backdrop-filter:blur(12px);
  padding:1.2rem 1.6rem;
  opacity:0;animation:fadeUp .8s 1.2s forwards;
}
.hero-card-num{
  font-family:'Unbounded',sans-serif;
  font-size:1.8rem;color:var(--gold);letter-spacing:.04em;display:block;line-height:1;
}
.hero-card-txt{font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.4);}
 
/* SECTIONS */
.section{padding:9rem 5rem;}
.section-inner{max-width:1200px;margin:0 auto;}
.section-tag{
  font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold);margin-bottom:1rem;
  display:flex;align-items:center;gap:1rem;
}
.section-tag::before{content:'';display:inline-block;width:2.5rem;height:1px;background:var(--gold);}
.section-title{
  font-family:'Fraunces',serif;
  font-size:clamp(1.9rem,4vw,3.2rem);
  font-weight:200;line-height:1.05;
  letter-spacing:-.02em;margin-bottom:.5rem;
}
.section-title em{font-style:italic;font-weight:700;color:var(--gold);}
 
/* SKILLS */
#skills{background:var(--navy);}
#skills .section-title{color:var(--cream);}
.skills-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(255px,1fr));
  gap:1px;background:rgba(255,255,255,.05);
  margin-top:4rem;border:1px solid rgba(255,255,255,.05);
}
.skill-card{
  background:var(--navy-mid);padding:2.5rem;
  position:relative;overflow:hidden;transition:background .3s;
}
.skill-card::after{
  content:'';position:absolute;top:0;left:0;right:0;
  height:2px;background:var(--gold);
  transform:scaleX(0);transition:transform .35s;transform-origin:left;
}
.skill-card:hover::after{transform:scaleX(1);}
.skill-card:hover{background:var(--navy-light);}
.skill-head{
  font-family:'Fraunces',serif;
  font-size:1.15rem;font-weight:400;font-style:italic;
  color:var(--cream);margin-bottom:1.2rem;
}
.skill-tags{display:flex;flex-wrap:wrap;gap:.4rem;}
.skill-tag{
  font-size:.63rem;letter-spacing:.07em;padding:.28rem .7rem;
  border:1px solid rgba(191,155,95,.2);
  color:rgba(255,255,255,.38);
  transition:all .2s;
}
.skill-card:hover .skill-tag{border-color:rgba(191,155,95,.45);color:var(--gold-light);}
  /* SERVICES */
#services{background:var(--off);}
.services-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:1.5rem;margin-top:4rem;
}
.service-card{
  background:var(--cream);padding:3rem 2.5rem;
  border:1px solid var(--mist);
  position:relative;overflow:hidden;transition:all .35s;
}
.service-card::before{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--gold);
  transform:scaleX(0);transition:transform .4s;transform-origin:left;
}
.service-card:hover::before{transform:scaleX(1);}
.service-card:hover{transform:translateY(-5px);box-shadow:0 25px 55px rgba(10,22,40,.09);}
.service-num{
  font-family:'Unbounded',sans-serif;
  font-size:2.5rem;color:var(--mist);line-height:1;margin-bottom:1.5rem;
}
.service-card h3{
  font-family:'Fraunces',serif;
  font-size:1.3rem;font-weight:400;font-style:italic;margin-bottom:.8rem;
}
.service-card p{font-size:.87rem;line-height:1.85;color:var(--grey);}
 
/* PROJECTS */
#projects{background:var(--cream);}
.projects-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:1.5rem;margin-top:4rem;
}
.proj-card{
  display:block;text-decoration:none;color:inherit;
  background:var(--navy);padding:3rem;
  position:relative;overflow:hidden;transition:all .35s;
}
.proj-card::after{
  content:'';position:absolute;top:0;left:0;
  width:100%;height:0;
  background:linear-gradient(180deg,rgba(191,155,95,.06) 0%,transparent);
  transition:height .4s;
}
.proj-card:hover::after{height:100%;}
.proj-card:hover{transform:translateY(-4px);box-shadow:0 28px 65px rgba(10,22,40,.38);}
.proj-num{
  font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:1.5rem;display:block;
}
.proj-tags{margin-bottom:1.2rem;}
.proj-tag{
  display:inline-block;
  font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;
  background:rgba(191,155,95,.08);border:1px solid rgba(191,155,95,.18);
  color:rgba(191,155,95,.65);padding:.23rem .7rem;margin-right:.4rem;margin-bottom:.4rem;
}
.proj-card h3{
  font-family:'Fraunces',serif;
  font-size:1.45rem;font-weight:400;font-style:italic;
  color:var(--cream);margin-bottom:.8rem;line-height:1.25;
}
.proj-card p{font-size:.84rem;line-height:1.8;color:rgba(255,255,255,.4);margin-bottom:2rem;}
.proj-arrow{
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:.72rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--gold);transition:gap .2s;
}
.proj-card:hover .proj-arrow{gap:.9rem;}
 
/* EXPERIENCE */
#experience{background:var(--off);}
.timeline{margin-top:4rem;position:relative;padding-left:1.5rem;}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--mist);}
.tl-item{
  position:relative;padding-bottom:3.2rem;padding-left:2.5rem;
  opacity:0;transform:translateX(-18px);transition:all .55s;
}
.tl-item.visible{opacity:1;transform:translateX(0);}
.tl-dot{
  position:absolute;left:-2rem;top:.35rem;
  width:11px;height:11px;
  background:var(--cream);border:2px solid var(--gold);
  border-radius:50%;transition:background .25s;
}
.tl-item:hover .tl-dot{background:var(--gold);}
.tl-date{font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem;}
.tl-co{font-size:.78rem;color:var(--grey);margin-bottom:.3rem;font-weight:500;}
.tl-role{
  font-family:'Fraunces',serif;
  font-size:1.25rem;font-weight:400;font-style:italic;margin-bottom:.9rem;
}
.tl-points{list-style:none;}
.tl-points li{
  font-size:.86rem;line-height:1.85;color:#3d3d52;
  padding-left:1.2rem;position:relative;margin-bottom:.4rem;
}
.tl-points li::before{content:'—';position:absolute;left:0;color:var(--gold);font-size:.75rem;}
 
/* WHY ME */
#why{background:var(--navy);}
#why .section-title{color:var(--cream);}
.why-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:1.5rem;margin-top:4rem;
}
.why-card{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
  padding:2.5rem;transition:all .3s;
}
.why-card:hover{background:rgba(191,155,95,.055);border-color:rgba(191,155,95,.18);transform:translateY(-4px);}
.why-head{
  font-family:'Fraunces',serif;
  font-size:1.15rem;font-style:italic;
  color:var(--cream);margin-bottom:.8rem;
}
.why-card p{font-size:.86rem;line-height:1.8;color:rgba(255,255,255,.42);}
.why-marker{
  width:2rem;height:1px;background:var(--gold);
  margin-bottom:1.2rem;
}
